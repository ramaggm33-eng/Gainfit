<!-- ===== POP-UP CATAT OLAHRAGA ===== -->
<div class="latar" id="popup">
    <div class="popup">
        <h3 id="judulPopup">Catat Olahraga</h3>
        <br>
        Durasi (menit)
        <input type="number" id="inputMenit" placeholder="0">
        Catatan (boleh kosong)
        <textarea id="inputCatatan" maxlength="255" placeholder="Contoh: latihan dada, naik beban 5 kg"></textarea>
        <div class="dua-tombol">
            <button class="tombol" onclick="tutupPopup()">Batal</button>
            <button class="tombol" onclick="simpanAktivitas()">Simpan</button>
        </div>
    </div>
</div>
